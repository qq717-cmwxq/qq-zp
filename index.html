<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Card Vault</title>
<style>
:root {
  /* 黑白极简暗色 */
  --bg-base: #0a0a0c;
  --bg-gradient: radial-gradient(circle at 0% 0%, #2a2a35 0%, #0a0a0c 50%),
                 radial-gradient(circle at 100% 100%, #1a1a24 0%, transparent 50%);
  --glass-bg: rgba(20, 20, 25, 0.45);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.03);
  --text-main: #ffffff;
  --text-sub: #a1a1a6;
  --text-muted: #636366;
  --accent: #ffffff;
  --danger: #ff453a;
  --group-bg: rgba(255, 255, 255, 0.1);
  --group-text: #ffffff;
  --wheel-1: rgba(255,255,255,0.15); --wheel-2: rgba(255,255,255,0.05); --wheel-3: rgba(255,255,255,0.1); --wheel-4: rgba(255,255,255,0.02);
  --wheel-text: #fff;
}
[data-theme="light"] {
  /* 纯白通透 */
  --bg-base: #f2f2f7;
  --bg-gradient: radial-gradient(circle at 0% 0%, #ffffff 0%, #f2f2f7 50%),
                 radial-gradient(circle at 100% 100%, #e5e5ea 0%, transparent 50%);
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(0, 0, 0, 0.08);
  --glass-highlight: rgba(0, 0, 0, 0.03);
  --text-main: #1c1c1e;
  --text-sub: #8e8e93;
  --text-muted: #c7c7cc;
  --accent: #000000;
  --danger: #ff3b30;
  --group-bg: rgba(0, 122, 255, 0.1);
  --group-text: #007aff;
  --wheel-1: rgba(0,0,0,0.15); --wheel-2: rgba(0,0,0,0.05); --wheel-3: rgba(0,0,0,0.1); --wheel-4: rgba(0,0,0,0.02);
  --wheel-text: #1c1c1e;
}
[data-theme="morandi"] {
  /* 莫兰迪灰绿 */
  --bg-base: #e3e8e4;
  --bg-gradient: radial-gradient(circle at 0% 0%, #f0f4f1 0%, #e3e8e4 50%),
                 radial-gradient(circle at 100% 100%, #d0d9d3 0%, transparent 50%);
  --glass-bg: rgba(227, 232, 228, 0.65);
  --glass-border: rgba(100, 120, 110, 0.15);
  --glass-highlight: rgba(100, 120, 110, 0.05);
  --text-main: #2d3a33;
  --text-sub: #6b7c72;
  --text-muted: #a3b3a9;
  --accent: #2d3a33;
  --danger: #d16a6a;
  --group-bg: rgba(100, 120, 110, 0.15);
  --group-text: #3a4a41;
  --wheel-1: rgba(100,120,110,0.15); --wheel-2: rgba(100,120,110,0.05); --wheel-3: rgba(100,120,110,0.1); --wheel-4: rgba(100,120,110,0.02);
  --wheel-text: #2d3a33;
}
[data-theme="pink"] {
  /* 奶油藕粉 */
  --bg-base: #f6ebeb;
  --bg-gradient: radial-gradient(circle at 0% 0%, #fcf5f5 0%, #f6ebeb 50%),
                 radial-gradient(circle at 100% 100%, #ebdada 0%, transparent 50%);
  --glass-bg: rgba(246, 235, 235, 0.65);
  --glass-border: rgba(180, 140, 140, 0.15);
  --glass-highlight: rgba(180, 140, 140, 0.05);
  --text-main: #4a3535;
  --text-sub: #8c7070;
  --text-muted: #c4a7a7;
  --accent: #4a3535;
  --danger: #d16a6a;
  --group-bg: rgba(180, 140, 140, 0.2);
  --group-text: #8c4040;
  --wheel-1: rgba(180,140,140,0.15); --wheel-2: rgba(180,140,140,0.05); --wheel-3: rgba(180,140,140,0.1); --wheel-4: rgba(180,140,140,0.02);
  --wheel-text: #4a3535;
}
[data-theme="blue"] {
  /* 静谧夜空蓝 */
  --bg-base: #0d1b2a;
  --bg-gradient: radial-gradient(circle at 0% 0%, #1b263b 0%, #0d1b2a 50%),
                 radial-gradient(circle at 100% 100%, #22334a 0%, transparent 50%);
  --glass-bg: rgba(27, 38, 59, 0.45);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-highlight: rgba(255, 255, 255, 0.04);
  --text-main: #e0e1dd;
  --text-sub: #9a9fa8;
  --text-muted: #5f6774;
  --accent: #e0e1dd;
  --danger: #ff6b6b;
  --group-bg: rgba(255, 255, 255, 0.12);
  --group-text: #e0e1dd;
  --wheel-1: rgba(255,255,255,0.12); --wheel-2: rgba(255,255,255,0.04); --wheel-3: rgba(255,255,255,0.08); --wheel-4: rgba(255,255,255,0.02);
  --wheel-text: #e0e1dd;
}

:root {
  --blur: blur(24px) saturate(180%);
  --radius: 24px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-base);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.4s, color 0.4s;
}

#fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

header {
  position: sticky; top: 0; z-index: 10;
  padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--glass-bg);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
}
.brand { font-weight: 600; font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.icon-btn {
  background: var(--glass-highlight); border: 1px solid var(--glass-border);
  color: var(--text-main); width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; backdrop-filter: var(--blur);
}
select.fx-select {
  background: var(--glass-highlight); border: 1px solid var(--glass-border);
  color: var(--text-main); padding: 0 12px; height: 36px; border-radius: 18px;
  font-size: 13px; outline: none; backdrop-filter: var(--blur); appearance: none;
}

main {
  padding: 20px 16px calc(100px + var(--safe-bottom));
  max-width: 800px; margin: 0 auto;
  position: relative; z-index: 2;
}
.page { display: none; animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 12px calc(8px + var(--safe-bottom));
  background: var(--glass-bg);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-top: 1px solid var(--glass-border);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.05);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text-sub); font-size: 10px; font-weight: 500;
  border: none; background: none; cursor: pointer; padding: 8px 12px;
  transition: 0.3s; border-radius: 12px; white-space: nowrap;
}
.nav-item svg { width: 22px; height: 22px; fill: currentColor; }
.nav-item.active { color: var(--text-main); background: var(--glass-highlight); }

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}

.toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.search-box {
  width: 100%; padding: 14px 18px; border-radius: 16px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  color: var(--text-main); font-size: 15px; outline: none;
}
.search-box::placeholder { color: var(--text-sub); }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-row select {
  padding: 10px 16px; border-radius: 12px; font-size: 13px; flex-shrink: 0;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  color: var(--text-main); backdrop-filter: var(--blur); outline: none;
}
.action-btn {
  padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--glass-border); background: var(--glass-highlight);
  color: var(--text-main); cursor: pointer; transition: 0.2s;
}
.action-btn.primary { background: var(--text-main); color: var(--bg-base); border: none; }
.action-btn:active { transform: scale(0.96); }

/* 角色卡 */
.cards-list { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 16px; transition: 0.3s;
}
.card-head { display: flex; align-items: center; gap: 16px; cursor: pointer; }
.avatar {
  width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
  background: var(--glass-highlight); border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; color: var(--text-sub); overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.card-info { flex: 1; min-width: 0; }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 分组和标签区分及滑动 */
.card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-sub); overflow: hidden; width: 100%; }
.meta-group { 
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
  background: var(--group-bg); color: var(--group-text); font-weight: 500;
  flex-shrink: 0;
}
.meta-tags { 
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; 
  flex: 1; padding-bottom: 2px; 
}
.meta-tags::-webkit-scrollbar { display: none; }
.meta-tag { 
  background: var(--glass-highlight); padding: 2px 6px; border-radius: 4px; white-space: nowrap;
}
.meta-tag::before { content: "#"; opacity: 0.5; margin-right: 1px; }

.arrow { color: var(--text-muted); transition: 0.3s; font-size: 12px; flex-shrink: 0; }
.card.open .arrow { transform: rotate(180deg); }

.card-body { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--glass-border); }
.card.open .card-body { display: block; animation: fadeIn 0.3s; }
.section-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
textarea.note-input {
  width: 100%; padding: 12px; border-radius: 12px; min-height: 60px; resize: vertical;
  background: var(--glass-highlight); border: 1px solid var(--glass-border);
  color: var(--text-main); font-size: 13px; font-family: inherit; outline: none;
}
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.card-actions label, .card-actions button {
  padding: 8px 12px; font-size: 12px; border-radius: 10px;
  background: transparent; border: 1px solid var(--glass-border);
  color: var(--text-main); cursor: pointer;
}

/* 美化后的 JSONL 区块 */
.jsonl-block { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(128,128,128,0.05); }
.jsonl-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; font-weight: 500; word-break: break-all; }
.jsonl-header span { flex: 1; margin-right: 10px; }
.jsonl-header button { border: none; background: none; color: var(--text-sub); font-size: 12px; white-space: nowrap; padding: 4px; }
.jsonl-header button.del-jl { color: var(--danger); }

.jsonl-note-wrap { position: relative; }
.jsonl-note-wrap::before {
  content: "✎"; position: absolute; left: 12px; top: 9px; 
  color: var(--text-sub); font-size: 12px; pointer-events: none; opacity: 0.7;
}
.jsonl-note-wrap textarea {
  width: 100%; min-height: 36px; padding: 8px 12px 8px 30px; 
  background: rgba(128,128,128,0.05); border: none; border-radius: 8px;
  color: var(--text-main); font-size: 12px; font-family: inherit; resize: none;
  outline: none; transition: 0.2s;
}
.jsonl-note-wrap textarea:focus { background: rgba(128,128,128,0.1); }

/* 转盘页面 */
.wheel-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.wheel-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 380px; margin: 0 auto; }
#wheelCanvas { width: 100%; height: 100%; display: block; }
.wheel-pointer {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-top: 24px solid var(--text-main); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); z-index: 3;
}
.spin-btn {
  width: 80%; max-width: 300px; padding: 16px; border-radius: 20px; margin-top: 10px;
  background: var(--text-main); color: var(--bg-base); border: none;
  font-size: 18px; font-weight: 600; letter-spacing: 0.1em; cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: 0.2s;
}
.spin-btn:active { transform: scale(0.95); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 抽奖结果弹窗 */
.result-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 90;
  display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
  animation: fadeIn 0.3s;
}
.result-card {
  background: var(--glass-bg); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); border-radius: 32px; padding: 30px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.2); width: 100%; max-width: 320px;
}
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-card .avatar { width: 100px; height: 100px; font-size: 40px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
.result-card h2 { font-size: 22px; font-weight: 700; margin-top: 8px; letter-spacing: 0.05em; }
.result-card p { color: var(--text-sub); font-size: 13px; margin-bottom: 12px; }
.result-close { 
  background: var(--text-main); color: var(--bg-base); border: none; padding: 12px 30px; 
  border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer;
}

.wheel-settings { width: 100%; margin-top: 20px; padding: 16px; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--glass-border); font-size: 14px; }
.settings-row:last-child { border-bottom: none; }
.switch { position: relative; width: 50px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--glass-highlight); border: 1px solid var(--glass-border); border-radius: 30px; transition: .4s; cursor: pointer; }
.slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background: var(--text-sub); border-radius: 50%; transition: .4s; }
input:checked + .slider { background: var(--text-main); }
input:checked + .slider:before { transform: translateX(20px); background: var(--bg-base); }
.wheel-items-list { max-height: 250px; overflow-y: auto; margin-top: 10px; }
.w-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--glass-border); font-size: 14px; }
.w-item input[type="number"] { width: 50px; padding: 6px; border-radius: 8px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-main); text-align: center; }

/* 小剧场 */
.theater-list { display: flex; flex-direction: column; gap: 16px; }
.theater-item { padding: 16px; border-radius: 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--blur); }
.theater-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.theater-body { font-size: 13px; color: var(--text-sub); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
.theater-actions { display: flex; gap: 8px; }
.theater-actions button { padding: 6px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-main); }

/* 弹窗 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s; }
.modal { width: 100%; max-width: 600px; background: var(--bg-base); border: 1px solid var(--glass-border); border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }
.modal input[type="text"], .modal textarea { width: 100%; padding: 14px; border-radius: 12px; margin-bottom: 12px; background: var(--glass-highlight); border: 1px solid var(--glass-border); color: var(--text-main); font-size: 14px; outline: none; }
.modal textarea { min-height: 120px; resize: vertical; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.preview-box { padding: 12px; border-radius: 12px; background: var(--glass-highlight); font-size: 13px; line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 12px; }

.empty { text-align: center; color: var(--text-sub); padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>
<canvas id="fxCanvas"></canvas>

<header>
  <div class="brand">Card Vault</div>
  <div class="header-actions">
    <select id="fxSelect" class="fx-select">
      <option value="none">无特效</option>
      <option value="snow">❄ 雪</option>
      <option value="rain">☂ 雨</option>
      <option value="petals">🌸 花瓣</option>
    </select>
    <button id="themeBtn" class="icon-btn">◐</button>
  </div>
</header>

<main>
  <section id="page-cards" class="page active">
    <div class="toolbar">
      <input id="searchInput" class="search-box" placeholder="搜索角色 / 标签 / 备注">
      <div class="filter-row">
        <select id="groupFilter"><option value="">全部分组</option></select>
        <select id="sortSelect">
          <option value="created">按最新</option>
          <option value="name">按名字</option>
        </select>
        <label class="action-btn" style="flex-shrink:0">导入 JSON<input type="file" id="importJson" accept=".json" multiple hidden></label>
        <button id="newCardBtn" class="action-btn" style="flex-shrink:0">新建</button>
      </div>
    </div>
    <div id="cardsGrid" class="cards-list"></div>
    <div id="emptyHint" class="empty" hidden>还没有角色卡，先导入一个 JSON 吧。</div>
  </section>

  <section id="page-wheel" class="page">
    <div class="wheel-container">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheelCanvas"></canvas>
        <div class="wheel-pointer"></div>
      </div>
      <button id="spinBtn" class="spin-btn">开 始 抽 取</button>
      
      <div class="glass-panel wheel-settings">
        <div class="settings-row">
          <span>不重复抽取</span>
          <label class="switch"><input type="checkbox" id="noRepeatToggle"><span class="slider"></span></label>
        </div>
        <div class="settings-row">
          <span>音效</span>
          <label class="switch"><input type="checkbox" id="soundToggle" checked><span class="slider"></span></label>
        </div>
        <div class="settings-row" style="margin-top:10px; border:none; padding-bottom:0">
          <span style="font-weight:600">参与角色 & 权重</span>
          <button id="resetDrawn" class="theater-actions" style="padding:4px 8px; border-radius:6px; border:1px solid var(--glass-border); background:none; color:var(--text-main); font-size:12px">重置已抽</button>
        </div>
        <div id="wheelList" class="wheel-items-list"></div>
      </div>
    </div>
  </section>

  <section id="page-theater" class="page">
    <div class="toolbar">
      <button id="newTheaterBtn" class="action-btn primary">+ 新建小剧场</button>
    </div>
    <div id="theaterList" class="theater-list"></div>
  </section>

  <section id="page-settings" class="page">
    <div class="glass-panel" style="padding: 20px; display:flex; flex-direction:column; gap:12px;">
      <h3 style="font-size:16px; margin-bottom:8px;">数据管理</h3>
      <button id="exportAll" class="action-btn">导出全量备份</button>
      <label class="action-btn">导入备份<input type="file" id="importAll" accept=".json" hidden></label>
      <button id="clearAll" class="action-btn" style="color:var(--danger); border-color:var(--danger)">清空所有数据</button>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="cards">

<div id="modalRoot"></div>

<script>
// ---------- IndexedDB ----------
const IDB = {
  db: null,
  open() { return new Promise((res, rej) => {
    const req = indexedDB.open('cardvault', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
    req.onsuccess = e => { this.db = e.target.result; res(); };
    req.onerror = rej;
  });},
  get(k) { return new Promise((res, rej) => {
    const tx = this.db.transaction('kv', 'readonly'); const req = tx.objectStore('kv').get(k);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  });},
  set(k, v) { return new Promise((res, rej) => {
    const tx = this.db.transaction('kv', 'readwrite'); const req = tx.objectStore('kv').put(v, k);
    req.onsuccess = () => res(); req.onerror = () => rej(req.error);
  });}
};

// ---------- State ----------
let state = { cards: [], theater: [], theme: 'dark', fx: 'none', noRepeat: false, sound: true, drawn: [] };
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => IDB.set('state', state), 300); }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ---------- Utils ----------
function download(txt, filename, mime='application/json') {
  const blob = new Blob([txt], {type: mime+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function readFile(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(f); }); }
function compressImg(f) { return new Promise((res, rej) => {
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => { URL.revokeObjectURL(url); let w = img.width, h = img.height;
    const s = Math.min(1, 300 / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h); res(c.toDataURL('image/jpeg', 0.85));
  }; img.onerror = rej; img.src = url;
});}

// ---------- Theme & FX ----------
const themes = ['dark', 'light', 'morandi', 'pink', 'blue'];
function applyTheme() { document.documentElement.dataset.theme = state.theme; drawWheel(); }
$('#themeBtn').onclick = () => { 
  const idx = themes.indexOf(state.theme); 
  state.theme = themes[(idx + 1) % themes.length]; 
  applyTheme(); save(); 
};

let audioCtx = null;
function beep(freq=880, dur=0.08, type='sine') {
  if (!state.sound) return;
  try { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e){}
}
function winSound() { beep(660,0.1); setTimeout(()=>beep(880,0.12),100); setTimeout(()=>beep(1100,0.2),220); }

// 特效系统（调整了雨的参数）
const fx = {
  canvas: null, ctx: null, particles: [], type: 'none',
  init() { this.canvas = $('#fxCanvas'); this.ctx = this.canvas.getContext('2d'); 
    window.onresize = () => this.resize(); this.resize(); this.loop(); },
  resize() { 
    const dpr = window.devicePixelRatio||1; 
    this.canvas.width = innerWidth*dpr; this.canvas.height = innerHeight*dpr; 
    this.canvas.style.width = innerWidth+'px'; this.canvas.style.height = innerHeight+'px'; 
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  setType(t) { this.type = t; this.particles = []; if(t==='none') return; 
    const c = t==='rain'?80:t==='snow'?50:30; 
    for(let i=0;i<c;i++) this.particles.push(this.spawn(true)); 
  },
  spawn(randomY=false) { const w = innerWidth, h = innerHeight;
    const y = randomY ? Math.random()*h : -20;
    if(this.type==='snow') return {x:Math.random()*w, y:y, r:Math.random()*2+1, vy:Math.random()*0.5+0.3, vx:(Math.random()-0.5)*0.2, a:Math.random()*0.5+0.3, p:Math.random()*Math.PI*2};
    // 雨滴变短，速度变慢
    if(this.type==='rain') return {x:Math.random()*w, y:y, l:Math.random()*10+5, vy:Math.random()*3+3, a:Math.random()*0.2+0.1};
    return {x:Math.random()*w, y:y, r:Math.random()*4+3, vy:Math.random()*0.8+0.3, vx:(Math.random()-0.5)*0.6, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.05, a:Math.random()*0.5+0.3, hue:Math.random()*40+330};
  },
  loop() { 
    if(!this.ctx) return; const ctx = this.ctx, w = innerWidth, h = innerHeight; 
    ctx.clearRect(0,0,w,h);
    if(this.type !== 'none') { 
      this.particles.forEach((p, idx) => {
        if(this.type === 'snow') { 
          p.p+=0.01; p.x+=Math.sin(p.p)*0.3+p.vx; p.y+=p.vy; 
          if(p.y>h+10){ this.particles[idx]=this.spawn(); } 
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,255,${p.a})`; ctx.fill(); 
        }
        else if(this.type === 'rain') { 
          p.y+=p.vy; p.x+=1; if(p.y>h+10){ this.particles[idx]=this.spawn(); } 
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-1,p.y+p.l); ctx.strokeStyle=`rgba(180,200,255,${p.a})`; ctx.lineWidth=1; ctx.stroke(); 
        }
        else { 
          p.y+=p.vy; p.x+=Math.sin(p.y*0.01)*0.5+p.vx; p.rot+=p.vr; 
          if(p.y>h+20){ this.particles[idx]=this.spawn(); } 
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); 
          ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.6,0,0,Math.PI*2); 
          ctx.fillStyle=`hsla(${p.hue},60%,80%,${p.a})`; ctx.fill(); ctx.restore(); 
        }
      });
    }
    requestAnimationFrame(() => this.loop());
  }
};

// ---------- Navigation ----------
function switchPage(name) {
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  if(name === 'wheel') { renderWheel(); setTimeout(drawWheel, 100); }
  if(name === 'theater') renderTheater();
}
$$('.nav-item').forEach(b => b.onclick = () => switchPage(b.dataset.page));

// ---------- Cards ----------
function getCards() {
  let l = [...state.cards];
  const q = $('#searchInput').value.trim().toLowerCase();
  const g = $('#groupFilter').value;
  if(q) l = l.filter(c => c.name.toLowerCase().includes(q) || (c.note||'').toLowerCase().includes(q) || (c.tags||[]).some(t=>t.toLowerCase().includes(q)));
  if(g) l = l.filter(c => (c.group||'') === g);
  l.sort((a,b) => $('#sortSelect').value === 'name' ? a.name.localeCompare(b.name,'zh') : b.createdAt - a.createdAt);
  return l;
}
function renderCards() {
  const grid = $('#cardsGrid'); const list = getCards();
  $('#emptyHint').hidden = list.length > 0;
  grid.innerHTML = '';
  list.forEach(c => grid.appendChild(renderCard(c)));
  
  const sel = $('#groupFilter'), cur = sel.value;
  const groups = [...new Set(state.cards.map(c => c.group).filter(Boolean))];
  sel.innerHTML = '<option value="">全部分组</option>' + groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.value = groups.includes(cur) ? cur : '';
}
function renderCard(card) {
  const el = document.createElement('div'); el.className = 'card'; el.dataset.id = card.id;
  const av = card.avatar ? `<img src="${card.avatar}">` : esc(card.name.slice(0,1));
  
  let groupHtml = card.group ? `<span class="meta-group">${esc(card.group)}</span>` : '';
  let tagsHtml = (card.tags||[]).length ? `<div class="meta-tags">${(card.tags||[]).map(t=>`<span class="meta-tag">${esc(t)}</span>`).join('')}</div>` : '';
  let jlCount = `<span>${card.jsonls.length} 个文件</span>`;

  el.innerHTML = `
    <div class="card-head">
      <div class="avatar">${av}</div>
      <div class="card-info">
        <div class="card-title">${esc(card.name)}</div>
        <div class="card-meta">
          ${groupHtml}${tagsHtml}
          ${(!card.group && !(card.tags||[]).length) ? jlCount : ''}
        </div>
      </div>
      <div class="arrow">▼</div>
    </div>
    <div class="card-body">
      <div class="section-label">备注</div>
      <textarea class="note-input card-note" placeholder="写点备注…">${esc(card.note||'')}</textarea>
      <div class="card-actions">
        <label>换头像<input type="file" class="av-input" accept="image/*" hidden></label>
        <button class="dl-json">下载 JSON</button>
        <label>导入 JSONL<input type="file" class="jl-input" accept=".jsonl,.txt" hidden></label>
        <button class="edit-meta">分组/标签</button>
        <button class="del-card" style="color:var(--danger)">删除</button>
      </div>
      <div class="jl-area"></div>
    </div>
  `;
  el.querySelector('.card-head').onclick = () => el.classList.toggle('open');
  const ta = el.querySelector('.card-note');
  ta.oninput = () => { card.note = ta.value; save(); };
  el.querySelector('.av-input').onchange = async e => { const f = e.target.files[0]; if(!f) return; card.avatar = await compressImg(f); save(); renderCards(); };
  el.querySelector('.dl-json').onclick = () => download(card.rawJson, card.name.replace(/[\\/:*?"<>|]/g,'_')+'.json');
  el.querySelector('.jl-input').onchange = async e => { const f = e.target.files[0]; if(!f) return; await importJL(card, f); e.target.value=''; };
  el.querySelector('.edit-meta').onclick = () => editMeta(card);
  el.querySelector('.del-card').onclick = () => { if(confirm(`删除「${card.name}」?`)) { state.cards = state.cards.filter(x=>x.id!==card.id); save(); renderCards(); } };
  renderJL(el.querySelector('.jl-area'), card);
  return el;
}

// JSONL 备注美化
function renderJL(container, card) {
  container.innerHTML = '';
  card.jsonls.forEach(jl => {
    const block = document.createElement('div'); block.className = 'jsonl-block';
    block.innerHTML = `
      <div class="jsonl-header">
        <span>📄 ${esc(jl.filename)}</span>
        <span><button class="dl-jl">下载</button><button class="del-jl" style="margin-left:10px">删除</button></span>
      </div>
      <div class="jsonl-note-wrap">
        <textarea placeholder="添加文件备注...">${esc(jl.note||'')}</textarea>
      </div>
    `;
    const ta = block.querySelector('textarea');
    ta.oninput = () => { jl.note = ta.value; save(); };
    block.querySelector('.dl-jl').onclick = () => download(jl.rawText, jl.filename, 'application/jsonl');
    block.querySelector('.del-jl').onclick = () => { if(confirm('删除该文件?')) { card.jsonls = card.jsonls.filter(x=>x.id!==jl.id); save(); renderCards(); } };
    container.appendChild(block);
  });
}
async function importJL(card, file) {
  const txt = await readFile(file);
  card.jsonls.push({ id: uid(), filename: file.name, rawText: txt, note: '' });
  save(); renderCards();
}
function editMeta(card) {
  openModal('分组 / 标签', `
    <input type="text" id="m-g" placeholder="分组" value="${esc(card.group||'')}">
    <input type="text" id="m-t" placeholder="标签 (用逗号分隔)" value="${esc((card.tags||[]).join(','))}">
    <div class="modal-actions"><button class="action-btn" data-close>取消</button><button class="action-btn primary" id="m-s">保存</button></div>
  `, m => {
    m.querySelector('#m-s').onclick = () => {
      card.group = m.querySelector('#m-g').value.trim();
      card.tags = m.querySelector('#m-t').value.split(',').map(s=>s.trim()).filter(Boolean);
      save(); renderCards(); closeModal();
    };
  });
}
$('#importJson').onchange = async e => {
  for(const f of e.target.files) {
    const txt = await readFile(f); let obj;
    try { obj = JSON.parse(txt); } catch (err) { alert(f.name+' 解析失败'); continue; }
    const name = obj.name || obj.char_name || obj.title || f.name.replace(/\.json$/i,'');
    state.cards.push({ id: uid(), name, rawJson: txt, avatar: '', note: '', group: '', tags: [], createdAt: Date.now(), jsonls: [] });
  }
  save(); renderCards(); e.target.value = '';
};
$('#newCardBtn').onclick = () => {
  const name = prompt('角色名:'); if(!name) return;
  state.cards.push({ id: uid(), name, rawJson: JSON.stringify({name}, null, 2), avatar: '', note: '', group: '', tags: [], createdAt: Date.now(), jsonls: [] });
  save(); renderCards();
};
$('#searchInput').oninput = renderCards;
$('#groupFilter').onchange = renderCards;
$('#sortSelect').onchange = renderCards;

// ---------- Wheel ----------
let wheelAngle = 0, spinning = false;
function getWheelItems() { return state.cards.filter(c => c.wheelOn !== false && !(state.noRepeat && state.drawn.includes(c.id))); }

function renderWheel() {
  const list = $('#wheelList'); list.innerHTML = '';
  if(!state.cards.length) list.innerHTML = '<div style="font-size:12px;color:var(--text-sub);padding:10px 0">暂无角色卡</div>';
  state.cards.forEach(c => {
    const on = c.wheelOn !== false, drawn = state.drawn.includes(c.id);
    const div = document.createElement('div'); div.className = 'w-item';
    div.innerHTML = `
      <input type="checkbox" ${on?'checked':''} style="accent-color:var(--text-main)">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}${drawn?' ✓':''}</span>
      <input type="number" min="1" max="99" value="${c.weight||1}">
    `;
    div.querySelector('input[type="checkbox"]').onchange = e => { c.wheelOn = e.target.checked; save(); renderWheel(); drawWheel(); };
    div.querySelector('input[type="number"]').oninput = e => { c.weight = Math.max(1, parseInt(e.target.value)||1); save(); drawWheel(); };
    list.appendChild(div);
  });
  drawWheel();
}

function drawWheel() {
  const canvas = $('#wheelCanvas'); if(!canvas) return;
  const size = canvas.clientWidth; if(!size) return;
  const dpr = window.devicePixelRatio||1;
  canvas.width = size*dpr; canvas.height = size*dpr;
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,size,size);
  const cx = size/2, cy = size/2, r = size/2-10;
  const items = getWheelItems();
  
  const cs = getComputedStyle(document.documentElement);
  const c1 = cs.getPropertyValue('--wheel-1').trim(), c2 = cs.getPropertyValue('--wheel-2').trim();
  const c3 = cs.getPropertyValue('--wheel-3').trim(), c4 = cs.getPropertyValue('--wheel-4').trim();
  const textColor = cs.getPropertyValue('--wheel-text').trim();
  const shades = [c1, c2, c3, c4];

  if(!items.length) {
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=c2; ctx.fill();
    ctx.fillStyle=textColor; ctx.globalAlpha=0.5; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('请勾选参与角色', cx, cy); return;
  }
  const total = items.reduce((s,i)=>s+(i.weight||1),0); let start = wheelAngle;
  items.forEach((item,i) => {
    const ang = ((item.weight||1)/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+ang); ctx.closePath();
    ctx.fillStyle = shades[i % shades.length]; ctx.fill();
    ctx.strokeStyle = 'rgba(128,128,128,0.2)'; ctx.lineWidth=1; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(start+ang/2); ctx.textAlign='right'; ctx.fillStyle=textColor; ctx.font='bold 12px sans-serif';
    if(ang > 0.2) ctx.fillText(item.name.length>6?item.name.slice(0,6)+'...':item.name, r-15, 4);
    ctx.restore(); start += ang;
  });
  ctx.beginPath(); ctx.arc(cx,cy,20,0,Math.PI*2); ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fill(); ctx.strokeStyle='rgba(128,128,128,0.3)'; ctx.stroke();
}

function spin() {
  if(spinning) return; const items = getWheelItems();
  if(!items.length) return alert('没有可抽取的角色');
  
  spinning = true; $('#spinBtn').disabled = true; 
  const btn = $('#spinBtn'); btn.innerText = '抽取中...';
  beep(220,0.05,'triangle');
  
  const total = items.reduce((s,i)=>s+(i.weight||1),0);
  let rand = Math.random()*total, idx=0, acc=0;
  for(let i=0;i<items.length;i++) { acc+=(items[i].weight||1); if(rand<=acc){idx=i;break;} }
  
  let off=0; for(let i=0;i<idx;i++) off+=((items[i].weight||1)/total)*Math.PI*2;
  const sliceAng = ((items[idx].weight||1)/total)*Math.PI*2, centerOff = off + sliceAng/2;
  
  // 修复每次点击转动问题
  const baseTarget = -Math.PI/2 - centerOff;
  const start = wheelAngle;
  let diff = baseTarget - start;
  while (diff < Math.PI * 2 * 5) diff += Math.PI * 2; 
  const target = start + diff;
  
  const dur = 2800, t0 = performance.now();
  let lastBeep = 0;
  
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  
  function frame(now) {
    const t = Math.min(1, (now-t0)/dur); 
    wheelAngle = start + (target-start)*easeOutBack(t); 
    drawWheel();
    if(t < 1) { 
      if(now-lastBeep > (40+t*150)) { beep(1000,0.02,'square'); lastBeep=now; } 
      requestAnimationFrame(frame); 
    } else {
      spinning = false; btn.disabled = false; btn.innerText = '开 始 抽 取';
      wheelAngle = target % (Math.PI * 2); // 归一化
      winSound();
      const w = items[idx]; 
      if(state.noRepeat) { state.drawn.push(w.id); save(); }
      renderWheel();
      showResultCard(w);
    }
  }
  requestAnimationFrame(frame);
}

function showResultCard(w) {
  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  const av = w.avatar ? `<img src="${w.avatar}">` : esc(w.name.slice(0,1));
  
  overlay.innerHTML = `
    <div class="result-card">
      <div class="avatar">${av}</div>
      <p>🎉 恭喜抽中</p>
      <h2>${esc(w.name)}</h2>
      <button class="result-close">收下结果</button>
    </div>
  `;
  document.body.appendChild(overlay);
  
  for(let i=0; i<40; i++) {
    fx.particles.push({
      x: innerWidth/2 + (Math.random()-0.5)*200, y: innerHeight/2,
      r: Math.random()*4+2, vy: -(Math.random()*5+2), vx: (Math.random()-0.5)*4,
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.2, a: 1, 
      hue: Math.random()*360
    });
  }
  
  overlay.querySelector('.result-close').onclick = () => {
    overlay.style.animation = 'fadeOut 0.3s forwards';
    setTimeout(() => overlay.remove(), 300);
  };
}

$('#spinBtn').onclick = spin;
$('#noRepeatToggle').onchange = e => { state.noRepeat = e.target.checked; save(); renderWheel(); };
$('#soundToggle').onchange = e => { state.sound = e.target.checked; save(); };
$('#resetDrawn').onclick = () => { state.drawn = []; save(); renderWheel(); };

// ---------- Theater ----------
function renderTheater() {
  const list = $('#theaterList'); list.innerHTML = '';
  if(!state.theater.length) { list.innerHTML = '<div class="empty">还没有小剧场</div>'; return; }
  state.theater.forEach(t => {
    const el = document.createElement('div'); el.className = 'theater-item';
    el.innerHTML = `
      <div class="theater-title">${esc(t.title)}</div>
      <div class="theater-body">${esc(t.content)}</div>
      <div class="theater-actions">
        <button class="t-copy">复制</button>
        <button class="t-rep">替换</button>
        <button class="t-edit">编辑</button>
        <button class="t-del" style="color:var(--danger)">删除</button>
      </div>
    `;
    el.querySelector('.t-copy').onclick = () => { navigator.clipboard.writeText(t.content); beep(880,0.05); };
    el.querySelector('.t-rep').onclick = () => repTheater(t);
    el.querySelector('.t-edit').onclick = () => editTheater(t);
    el.querySelector('.t-del').onclick = () => { if(confirm('删除?')) { state.theater = state.theater.filter(x=>x.id!==t.id); save(); renderTheater(); } };
    list.appendChild(el);
  });
}
function editTheater(t) {
  const isNew = !t, data = t || {title:'', content:''};
  openModal(isNew?'新建小剧场':'编辑', `
    <input type="text" id="t-t" placeholder="标题" value="${esc(data.title)}">
    <textarea id="t-c" placeholder="正文...">${esc(data.content)}</textarea>
    <div class="modal-actions"><button class="action-btn" data-close>取消</button><button class="action-btn primary" id="t-s">保存</button></div>
  `, m => {
    m.querySelector('#t-s').onclick = () => {
      const title = m.querySelector('#t-t').value.trim(), content = m.querySelector('#t-c').value;
      if(!title||!content) return alert('都要填');
      if(isNew) state.theater.unshift({id:uid(), title, content});
      else { t.title=title; t.content=content; }
      save(); renderTheater(); closeModal();
    };
  });
}
function repTheater(t) {
  openModal('查找替换', `
    <input type="text" id="r-f" placeholder="查找 (如 char)">
    <input type="text" id="r-r" placeholder="替换为...">
    <button class="action-btn" id="r-go" style="width:100%; margin-bottom:12px">生成预览</button>
    <div id="r-prev"></div>
    <div class="modal-actions"><button class="action-btn" data-close>关闭</button></div>
  `, m => {
    m.querySelector('#r-go').onclick = () => {
      const f = m.querySelector('#r-f').value, r = m.querySelector('#r-r').value;
      if(!f) return alert('请输入查找内容');
      const res = t.content.split(f).join(r), area = m.querySelector('#r-prev');
      area.innerHTML = `
        <div class="section-label">预览 (复制后销毁)</div>
        <div class="preview-box">${esc(res)}</div>
        <button class="action-btn primary" id="r-cp" style="width:100%">复制结果</button>
      `;
      area.querySelector('#r-cp').onclick = () => {
        navigator.clipboard.writeText(res).then(() => {
          beep(880,0.05); area.innerHTML = '<div class="empty" style="padding:20px 0">已复制 ✓</div>';
        });
      };
    };
  });
}
$('#newTheaterBtn').onclick = () => editTheater(null);

// ---------- Settings / Modal ----------
$('#exportAll').onclick = () => download(JSON.stringify(state, null, 2), 'backup.json');
$('#importAll').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try { const d = JSON.parse(await readFile(f));
    if(confirm('覆盖当前数据?')) { state = {...state, ...d}; await IDB.set('state', state); applyTheme(); renderCards(); renderWheel(); renderTheater(); fx.setType(state.fx||'none'); alert('已导入'); }
  } catch(err) { alert('文件损坏'); } e.target.value = '';
};
$('#clearAll').onclick = () => { if(!confirm('清空全部?')) return; state = { cards:[], theater:[], theme:state.theme, fx:state.fx, noRepeat:false, sound:true, drawn:[] }; save(); renderCards(); renderWheel(); renderTheater(); };
$('#fxSelect').onchange = e => { state.fx = e.target.value; save(); fx.setType(state.fx); };

function openModal(title, html, setup) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>${html}</div>`;
  bg.onclick = e => { if(e.target===bg) closeModal(); };
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  if(setup) setup(bg.querySelector('.modal'));
}
function closeModal() { const m = $('.modal-bg'); if(m) m.remove(); }

// ---------- Init ----------
(async function() {
  await IDB.open(); const saved = await IDB.get('state');
  if(saved) state = { ...state, ...saved };
  applyTheme();
  $('#fxSelect').value = state.fx || 'none';
  $('#noRepeatToggle').checked = !!state.noRepeat;
  $('#soundToggle').checked = state.sound !== false;
  renderCards(); renderWheel(); renderTheater();
  fx.init(); fx.setType(state.fx || 'none');
})();
</script>
</body>
</html>
